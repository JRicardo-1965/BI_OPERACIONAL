<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Comercial — Login</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --surface-2: #eeece6;
    --border: #e0ddd4;
    --text: #23211d;
    --text-muted: #6b6960;
    --text-faint: #98948a;
    --brand: #7c5cbf;
    --brand-soft: #ece5f6;
    --danger: #d1382c;
    --danger-soft: #fbe1de;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(35,33,29,0.06), 0 20px 48px rgba(20,20,15,0.16);
  }
  :root[data-theme="dark"] {
    --bg: #17151c;
    --surface: #1e1b25;
    --surface-2: #28242f;
    --border: #3a3542;
    --text: #ede9f2;
    --text-muted: #b0aabd;
    --text-faint: #7d7690;
    --brand-soft: #2f2440;
    --danger-soft: #3d1414;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 48px rgba(0,0,0,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17151c;
      --surface: #1e1b25;
      --surface-2: #28242f;
      --border: #3a3542;
      --text: #ede9f2;
      --text-muted: #b0aabd;
      --text-faint: #7d7690;
      --brand-soft: #2f2440;
      --danger-soft: #3d1414;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 20px 48px rgba(0,0,0,0.45);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--sans);
    color: var(--text);
    padding: 20px;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,191,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(124,92,191,0.10), transparent 45%),
      var(--bg);
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 34px 30px 28px;
  }
  .icon-badge {
    width: 56px;
    height: 56px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    background: linear-gradient(155deg, var(--brand), #5c3f99);
    box-shadow: 0 8px 20px rgba(124,92,191,0.35);
  }
  .icon-badge svg { color: #fff; }
  .heading { text-align: center; margin-bottom: 26px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brand);
    font-weight: 700;
    margin: 0 0 4px;
  }
  h1 { font-size: 21px; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { font-size: 12.5px; color: var(--text-muted); margin: 0; }
  label {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 700;
    margin: 0 0 6px;
  }
  .field { margin-bottom: 16px; }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap .field-icon {
    position: absolute;
    left: 12px;
    color: var(--text-faint);
    pointer-events: none;
    display: flex;
  }
  input {
    width: 100%;
    font-family: var(--sans);
    font-size: 14px;
    padding: 11px 12px 11px 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    transition: border-color .15s ease, background-color .15s ease;
  }
  input::placeholder { color: var(--text-faint); }
  input:focus {
    outline: none;
    border-color: var(--brand);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--brand-soft);
  }
  #senha { padding-right: 38px; }
  .toggle-visibility {
    position: absolute;
    right: 8px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    border-radius: 6px;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0;
  }
  .toggle-visibility:hover { color: var(--text-muted); background: var(--surface-2); }
  .toggle-visibility:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  button[type="submit"] {
    width: 100%;
    margin-top: 8px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    background: var(--brand);
    color: #fff;
    border: none;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
    box-shadow: 0 6px 16px rgba(124,92,191,0.3);
  }
  button[type="submit"]:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(124,92,191,0.38); }
  button[type="submit"]:active { transform: translateY(0); }
  button[type="submit"]:disabled { opacity: 0.65; cursor: default; transform: none; }
  .error {
    margin-top: 14px;
    padding: 9px 11px;
    border-radius: 9px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 12.5px;
    line-height: 1.4;
    display: none;
  }
  .error.is-visible { display: block; }
  .footer-note {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-faint);
    margin: 20px 0 0;
  }
</style>
</head>
<body>
  <form class="card" id="login-form">
    <div class="icon-badge" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    </div>
    <div class="heading">
      <p class="eyebrow">Comercial</p>
      <h1>Bem-vindo de volta</h1>
      <p class="sub">Entre com sua conta para acessar o BI</p>
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <div class="input-wrap">
        <span class="field-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </span>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="seuemail@empresa.com" required />
      </div>
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <div class="input-wrap">
        <span class="field-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Sua senha" required />
        <button type="button" class="toggle-visibility" id="toggle-senha" aria-label="Mostrar senha" title="Mostrar senha">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" id="submit-btn">
      <span id="submit-label">Entrar</span>
    </button>
    <p class="error" id="error-msg"></p>
    <p class="footer-note">Acesso restrito — fale com o administrador se não tiver uma conta.</p>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit-btn');
    const submitLabel = document.getElementById('submit-label');
    const errorEl = document.getElementById('error-msg');
    const senhaInput = document.getElementById('senha');
    const toggleBtn = document.getElementById('toggle-senha');

    const eyeIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const eyeOffIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.66 3.79M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

    toggleBtn.addEventListener('click', () => {
      const isPassword = senhaInput.type === 'password';
      senhaInput.type = isPassword ? 'text' : 'password';
      toggleBtn.innerHTML = isPassword ? eyeOffIcon : eyeIcon;
      toggleBtn.title = isPassword ? 'Ocultar senha' : 'Mostrar senha';
      toggleBtn.setAttribute('aria-label', toggleBtn.title);
    });

    const params = new URLSearchParams(location.search);
    if (params.get('desativado') === '1') {
      errorEl.textContent = 'Sua sessão expirou ou seu acesso foi desativado. Faça login novamente.';
      errorEl.classList.add('is-visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      submitLabel.textContent = 'Entrando...';
      errorEl.classList.remove('is-visible');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            senha: senhaInput.value
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          location.href = '/';
          return;
        }
        errorEl.textContent = data.error || 'Não foi possível entrar.';
        errorEl.classList.add('is-visible');
      } catch (err) {
        errorEl.textContent = 'Erro de conexão. Tente novamente.';
        errorEl.classList.add('is-visible');
      } finally {
        btn.disabled = false;
        submitLabel.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
